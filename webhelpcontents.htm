<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>目录 - ($PROJECTTITLE$)</title>
  <script src="assets/webhelp-prepaint.js" data-webhelp-kind="nav"></script>
  <link rel="stylesheet" href="assets/webhelp-nav.css">
  <script src="assets/webhelp-contents.js"></script>
</head>
<body class="nav-page contents-page">
  <section class="contents-tools" aria-label="目录工具">
    <div class="directory-filter">
      <label class="visually-hidden" for="directoryFilter">过滤当前目录</label>
      <input id="directoryFilter" type="search" placeholder="过滤当前目录……" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </div>
    <div class="tree-actions">
      <button id="expandSelectedButton" type="button" aria-label="展开当前项" title="展开当前项的下一级">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9 4 4 4-4M5 19h14"/></svg>
      </button>
      <button id="collapseAllButton" type="button" aria-label="全部收起" title="收起所有目录项">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 15 4-4 4 4M5 5h14"/></svg>
      </button>
      <button id="previousTopicButton" type="button" aria-label="上一篇" title="上一篇">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="nextTopicButton" type="button" aria-label="下一篇" title="下一篇">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <span class="filter-count" id="filterCount" aria-live="polite"></span>
    </div>
  </section>

  <div class="navigation-scroll" id="navigationScroll">
    <div class="navigation-loading" id="loading">正在生成目录……</div>
    <nav class="navigation-tree" id="navigationTree" aria-label="内容目录">
      ($NAVIGATION$)
    </nav>
  </div>
</body>
</html>
