<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>($PROJECTTITLE$)</title>
  <link rel="stylesheet" href="assets/webhelp-compat.css">
</head>
<body>
  <header class="compat-header" style="--legacy-back-color: ($BACKCOLOR$); --legacy-font-color: ($FONTCOLOR$);">
    <span>($PROJECTTITLE$)</span>
    <button id="compatPrint" type="button">打印</button>
  </header>
  <script>
  document.getElementById("compatPrint").addEventListener("click", function () {
    try { parent.main.content.focus(); parent.main.content.print(); } catch (error) { window.print(); }
  });
  </script>
</body>
</html>
