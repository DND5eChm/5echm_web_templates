<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>搜索 - ($PROJECTTITLE$)</title>
  <script src="assets/webhelp-prepaint.js" data-webhelp-kind="search"></script>
  <link rel="stylesheet" href="assets/webhelp-nav.css">
  <script src="data.js"></script>
  <script src="assets/webhelp-local-search.js" defer></script>
</head>
<body class="nav-page local-search-page">
  <section class="search-container">
    <h1 class="search-title">全文搜索</h1>
    <form id="localSearchForm">
      <div class="search-input-wrapper">
        <label class="visually-hidden" for="keyword">搜索关键词</label>
        <input id="keyword" type="search" placeholder="搜索规则、法术、怪物、物品……" autocomplete="off">
      </div>
      <div class="options-row">
        <label class="checkbox-label"><input type="checkbox" id="titleOnly"><span>只匹配标题</span></label>
        <label class="checkbox-label"><input type="checkbox" id="previousResult"><span>结果内搜索</span></label>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" type="submit">搜索</button>
        <button class="btn btn-ghost" id="openSelected" type="button">打开选中页面</button>
      </div>
    </form>
  </section>
  <section class="results-wrapper" aria-label="搜索结果">
    <div class="results-info" id="resultsInfo">找到 <strong id="resultsCount">0</strong> 个匹配结果</div>
    <div class="results-list-container">
      <ul class="results-list" id="resultsList">
        <li class="empty-state"><div class="empty-text">输入关键词即可开始搜索</div></li>
      </ul>
    </div>
  </section>
</body>
</html>
